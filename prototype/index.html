<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語習慣塾（プロトタイプ）</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英語習慣塾">
</head>
<body>

<!-- 画面0: 練習するPartの選択 -->
<section id="screen-part" class="screen">
  <header class="brand">
    <div class="mascot">🦉</div>
    <h1>英語習慣塾</h1>
    <p class="tagline">Versant練習用</p>
  </header>

  <ul class="part-list">
    <li><button class="part-item locked">
      <span class="part-code">A</span>
      <span class="part-body"><span class="part-name">Reading</span><span class="part-desc">文章の音読</span></span>
      <span class="part-status">作成中</span>
    </button></li>
    <li><button class="part-item enabled" id="part-b-button">
      <span class="part-code">B</span>
      <span class="part-body"><span class="part-name">Repeats（リピーティング）</span><span class="part-desc">聞いた文をそのまま繰り返す</span></span>
      <span class="part-status">▶</span>
    </button></li>
    <li><button class="part-item locked">
      <span class="part-code">C</span>
      <span class="part-body"><span class="part-name">Short Answer Questions</span><span class="part-desc">短い質問に一言で答える</span></span>
      <span class="part-status">作成中</span>
    </button></li>
    <li><button class="part-item locked">
      <span class="part-code">D</span>
      <span class="part-body"><span class="part-name">Sentence Builds</span><span class="part-desc">語句を並べ替えて文を作る</span></span>
      <span class="part-status">作成中</span>
    </button></li>
    <li><button class="part-item locked">
      <span class="part-code">E</span>
      <span class="part-body"><span class="part-name">Story Retelling</span><span class="part-desc">短い話を聞いて要約する</span></span>
      <span class="part-status">作成中</span>
    </button></li>
    <li><button class="part-item locked">
      <span class="part-code">F</span>
      <span class="part-body"><span class="part-name">Open Questions</span><span class="part-desc">自分の意見を話す</span></span>
      <span class="part-status">作成中</span>
    </button></li>
  </ul>
</section>

<!-- 画面1: レベル・アクセント選択 -->
<section id="screen-select" class="screen hidden">
  <header class="practice-header">
    <button class="btn-text" id="back-to-part">← Part選択に戻る</button>
  </header>

  <button id="lifetime-stats" class="lifetime-stats" type="button"></button>

  <div class="option-group">
    <p class="option-label">レベル</p>
    <div class="chip-group" id="level-group">
      <button class="chip active" data-level="beginner">初級</button>
      <button class="chip" data-level="intermediate">中級</button>
      <button class="chip" data-level="advanced">上級</button>
      <button class="chip" data-level="mix">ミックス</button>
    </div>
  </div>

  <div class="option-group">
    <p class="option-label">アクセント</p>
    <div class="chip-group" id="accent-group">
      <button class="chip active" data-accent="us">米</button>
      <button class="chip locked" data-accent="gb">英</button>
      <button class="chip locked" data-accent="au">豪</button>
      <button class="chip locked" data-accent="mix">ミックス</button>
    </div>
  </div>

  <button id="start-button" class="btn-primary btn-large">▶ はじめる</button>
</section>

<!-- 画面2: リスニング -->
<section id="screen-listen" class="screen hidden">
  <header class="practice-header">
    <button class="btn-text back-button">← 戻る</button>
    <span class="streak-badge hidden"></span>
  </header>
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
  <p class="progress-label"></p>

  <div class="listen-body">
    <audio id="tts-audio" preload="none"></audio>
    <button id="play-button" class="play-circle" aria-label="再生">▶</button>
    <p class="hint">タップでもう一度聞く</p>

    <div class="speed-group" id="speed-group">
      <button class="speed-chip" data-rate="0.75">0.75x</button>
      <button class="speed-chip active" data-rate="1">1x</button>
      <button class="speed-chip" data-rate="1.25">1.25x</button>
      <button class="speed-chip" data-rate="1.5">1.5x</button>
    </div>
  </div>

  <button id="reveal-button" class="btn-primary btn-large">回答へ</button>
</section>

<!-- 画面3: 回答・解説 -->
<section id="screen-answer" class="screen hidden">
  <header class="practice-header">
    <button class="btn-text back-button">← 戻る</button>
    <span class="streak-badge hidden"></span>
  </header>
  <p class="progress-label"></p>

  <p id="accuracy-label" class="accuracy-label"></p>

  <p id="answer-text" class="answer-text"></p>
  <button id="replay-on-answer" class="btn-secondary">🔁 もう一度聞く</button>

  <div class="explanation-box">
    <p class="explanation-title">解説</p>
    <p class="explanation-body">（今後追加予定）</p>
  </div>

  <div class="judge-group">
    <button id="judge-perfect" class="btn-judge btn-perfect">できた</button>
    <button id="judge-half" class="btn-judge btn-half">半分</button>
    <button id="judge-none" class="btn-judge btn-none">できなかった</button>
  </div>
</section>

<!-- 画面4: セッションリザルト -->
<section id="screen-summary" class="screen hidden">
  <header class="brand">
    <div class="mascot" id="summary-mascot">🎉</div>
    <h1>お疲れさま！</h1>
  </header>

  <div class="summary-stats">
    <p class="summary-row"><span>達成度</span><strong id="summary-accuracy"></strong></p>
    <p class="summary-row"><span>ベストストリーク</span><strong id="summary-streak"></strong></p>
    <p class="summary-row"><span>問題数</span><strong id="summary-total"></strong></p>
  </div>

  <button id="restart-button" class="btn-primary btn-large">🔁 もう一度（同じ設定）</button>
  <button id="share-button" class="btn-secondary">📤 結果をシェア</button>
  <button class="btn-text back-button">設定を変える</button>
</section>

<!-- 画面5: 統計・履歴 -->
<section id="screen-stats" class="screen hidden">
  <header class="practice-header">
    <button class="btn-text back-button">← 戻る</button>
    <span class="option-label" style="margin:0;">統計</span>
  </header>

  <div class="summary-stats">
    <p class="summary-row"><span>累計問題数</span><strong id="stats-total"></strong></p>
    <p class="summary-row"><span>達成度</span><strong id="stats-accuracy"></strong></p>
    <p class="summary-row"><span>連続練習日数</span><strong id="stats-streak"></strong></p>
    <p class="summary-row"><span>ストリークフリーズ</span><strong id="stats-freezes"></strong></p>
    <p class="summary-row"><span>プレイヤーレベル</span><strong id="stats-level"></strong></p>
    <p class="summary-row"><span>総練習時間</span><strong id="stats-practice-time"></strong></p>
  </div>

  <div class="week-calendar" id="week-calendar"></div>
  <p class="streak-countdown" id="streak-countdown"></p>

  <div class="option-group">
    <p class="option-label">今日の目標</p>
    <p class="daily-goal-label" id="daily-goal-label"></p>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="daily-goal-fill"></div></div>
  </div>

  <div class="option-group">
    <p class="option-label">今週の振り返り</p>
    <p class="weekly-report" id="weekly-report"></p>
  </div>

  <div class="option-group">
    <p class="option-label">達成度の推移（直近7日）</p>
    <div class="growth-chart" id="growth-chart"></div>
  </div>

  <div class="option-group">
    <p class="option-label">実績</p>
    <div class="badge-grid" id="badge-grid"></div>
  </div>

  <div class="option-group">
    <p class="option-label">レベル別達成度</p>
    <div class="summary-stats" id="stats-level-breakdown"></div>
  </div>

  <div class="option-group">
    <p class="option-label">苦手な問題（上位5件）</p>
    <div id="stats-weak-list"></div>
  </div>

  <button id="export-history-button" class="btn-secondary">⬇ 履歴をエクスポート（JSON）</button>
</section>

<!-- 正誤リアクション演出（問題間の一時停止も兼ねる） -->
<div id="reaction-overlay" class="reaction-overlay hidden">
  <span id="reaction-emoji" class="reaction-emoji"></span>
  <div class="reaction-bar-track"><div id="reaction-bar-fill" class="reaction-bar-fill"></div></div>
</div>

<!-- Part準備中タップ時のトースト -->
<div id="toast" class="toast"></div>

<p class="note">※プロトタイプにつき、ダミー問題・ブラウザ音声合成による仮再生です。タイトルは仮称です。</p>

<script src="app.js"></script>
</body>
</html>
